<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Retroreel: landmark films on one horizontal timeline, from the first silent shorts to today. See what you have seen on Letterboxd."
    />
    <meta name="theme-color" content="#120c0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>Retroreel</title>
    <script>
      // Apply the saved colors and fonts before the first paint, so a reload never flashes the defaults.
      // src/themes.ts keeps the options, saves the choice and loads the fonts.
      try {
        const palette = localStorage.getItem('retroreel.palette');
        const font = localStorage.getItem('retroreel.font');
        if (palette && palette !== 'velvet') document.documentElement.dataset.palette = palette;
        if (font && font !== 'poster') document.documentElement.dataset.font = font;
      } catch {
        // Storage blocked: the defaults it is.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
